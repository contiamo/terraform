name: Update Gateway API CRDs

on:
  schedule:
    - cron: "0 8 * * *" # daily at 08:00 UTC
  workflow_dispatch: {}

jobs:
  update-crds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.CONTIAMO_CI_TOKEN }}

      - name: Get latest stable Gateway API release
        id: latest
        run: |
          # Sort by semantic version, not publication date — a patch on an
          # older minor line can be published after a newer minor release.
          VERSION=$(gh api repos/kubernetes-sigs/gateway-api/releases \
            --jq '.[] | select(.prerelease == false and .draft == false) | .tag_name' \
            | sort -V | tail -n1)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Latest stable release: ${VERSION}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check if version already exists
        id: check
        run: |
          VERSION="${{ steps.latest.outputs.version }}"
          BRANCH="chore/gateway-api-crds-${VERSION}"
          # A PR in any state (open, merged or closed) means this version has
          # already been proposed. A closed PR is a deliberate "not this
          # version", so don't re-open it (and don't fail pushing to the
          # branch it left behind).
          EXISTING_PRS=$(gh pr list --head "$BRANCH" --state all --json number --jq 'length')
          if [[ -f "gateway-api-crds/crds/${VERSION}-standard-install.yaml" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Version ${VERSION} already exists — nothing to do."
          elif [[ "$EXISTING_PRS" -gt 0 ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A PR for ${BRANCH} already exists (possibly closed) — nothing to do."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "New version ${VERSION} found — updating."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check Envoy Gateway compatibility
        id: eg
        if: steps.check.outputs.skip == 'false'
        run: |
          # Envoy Gateway is the only Gateway API controller on our clusters.
          # Each EG release is compiled and tested against one Gateway API
          # version (the go.mod pin, shown in bold in
          # https://gateway.envoyproxy.io/news/releases/matrix/). Installing a
          # newer CRD minor than EG supports is untested, and since v1.7.0 the
          # bundle's safe-upgrades ValidatingAdmissionPolicy blocks rolling
          # back to an older minor.
          VERSION="${{ steps.latest.outputs.version }}"
          EG_TAG=$(gh api repos/envoyproxy/gateway/releases \
            --jq '.[] | select(.prerelease == false and .draft == false) | .tag_name' \
            | sort -V | tail -n1)
          EG_GWAPI=$(gh api -H 'Accept: application/vnd.github.raw' \
            "repos/envoyproxy/gateway/contents/go.mod?ref=${EG_TAG}" \
            | awk '$1 == "sigs.k8s.io/gateway-api" { print $2 }')
          if [[ -z "$EG_GWAPI" ]]; then
            echo "Could not read the Gateway API version from Envoy Gateway ${EG_TAG} go.mod" >&2
            exit 1
          fi
          NEW_MINOR="${VERSION%.*}"
          EG_MINOR="${EG_GWAPI%.*}"
          if [[ "$(printf '%s\n%s\n' "$EG_MINOR" "$NEW_MINOR" | sort -V | tail -n1)" == "$EG_MINOR" ]]; then
            SUPPORTED=true
          else
            SUPPORTED=false
          fi
          {
            echo "eg_tag=${EG_TAG}"
            echo "eg_gwapi=${EG_GWAPI}"
            echo "supported=${SUPPORTED}"
          } >> "$GITHUB_OUTPUT"
          echo "Envoy Gateway ${EG_TAG} is built against Gateway API ${EG_GWAPI}; ${VERSION} supported: ${SUPPORTED}"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install yq
        if: steps.check.outputs.skip == 'false'
        uses: mikefarah/yq@master

      - name: Run update script
        if: steps.check.outputs.skip == 'false'
        run: ./gateway-api-crds/scripts/update-crds.sh "${{ steps.latest.outputs.version }}"

      - name: Create pull request
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.latest.outputs.version }}"
          BRANCH="chore/gateway-api-crds-${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add gateway-api-crds/
          git commit -m "feat(gateway-api-crds): add CRDs ${VERSION}"
          git push -u origin "$BRANCH"

          EG_TAG="${{ steps.eg.outputs.eg_tag }}"
          EG_GWAPI="${{ steps.eg.outputs.eg_gwapi }}"
          DRAFT_FLAG=()
          if [[ "${{ steps.eg.outputs.supported }}" == "true" ]]; then
            COMPAT="Envoy Gateway **${EG_TAG}** (latest stable) is built against Gateway API **${EG_GWAPI}**, so this minor is supported. Confirm the clusters run an Envoy Gateway release at least that new before bumping their module pin."
          else
            DRAFT_FLAG=(--draft)
            COMPAT="> [!WARNING]
          > **Not supported by Envoy Gateway yet.** The latest stable Envoy Gateway (**${EG_TAG}**) is built against Gateway API **${EG_GWAPI}**. Do not merge until an Envoy Gateway release supports ${VERSION%.*}. Opened as a draft for that reason."
          fi

          cat > /tmp/pr-body.md <<PREOF
          ## Summary

          Adds Gateway API CRD version **${VERSION}** from [upstream release](https://github.com/kubernetes-sigs/gateway-api/releases/tag/${VERSION}).

          - Downloaded \`standard-install.yaml\` to \`crds/${VERSION}-standard-install.yaml\`
          - Bumped default version in \`variables.tf\` and \`README.md\`

          ## Envoy Gateway compatibility

          ${COMPAT}

          Matrix: https://gateway.envoyproxy.io/news/releases/matrix/

          ## Reviewer checklist

          - [ ] Envoy Gateway on EKS and OTC supports this Gateway API minor (bold column in the matrix above).
          - [ ] Served and storage API versions unchanged, or the migration is understood.
          - [ ] New CEL validation rules do not reject any live HTTPRoute/GRPCRoute.
          - [ ] Rollback understood: the bundle's \`safe-upgrades\` ValidatingAdmissionPolicy blocks installing older minors.

          Auto-generated by the \`update-gateway-api-crds\` workflow.
          PREOF

          gh pr create "${DRAFT_FLAG[@]}" \
            --title "feat(gateway-api-crds): add CRDs ${VERSION}" \
            --body-file /tmp/pr-body.md
        env:
          GH_TOKEN: ${{ secrets.CONTIAMO_CI_TOKEN }}
